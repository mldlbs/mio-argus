services:
  data-collector:
    build: .
    volumes:
      - ../computer_use_data_real_balanced:/app/data
    environment:
      - DISPLAY=:99
      - TARGET_PER_ACTION=84
    shm_size: "2gb"
    command: >
      bash -c "Xvfb :99 -screen 0 1920x1080x24 &
               sleep 2 &&
               python /app/collect_vm.py"