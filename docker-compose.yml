services:
  computer-use-api:
    build: .
    container_name: computer-use-api
    environment:
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_CACHE=/app/hf_cache
      - MODEL_PATH=/app/computer_use_model_v3_real.pth
    ports:
      - "8000:8000"
    volumes:
      - ./computer_use_model_v3_real.pth:/app/computer_use_model_v3_real.pth
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
